name: Update data

on:
  schedule:
    # Every 15 minutes, off the hour. GitHub runs scheduled workflows on a
    # best-effort basis and skipped 5 of the first 6 hourly slots, so more
    # slots make a long gap less likely. A run that finds no new judge run
    # commits nothing. Each data commit to main redeploys the site through
    # Cloudflare Workers Builds (wrangler.toml).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 update_data.py
      - name: Commit the CSV if it changed
        run: |
          git add data/leaderboard.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          latest=$(tail -n 1 data/leaderboard.csv | cut -d, -f1)
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update data through the $latest run"
          git push
